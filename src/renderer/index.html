<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'" />
  <title>bollfile — 点对点传输助手</title>
  <style>
    /* 打包内置中文字体：不依赖操作系统是否安装中文字体 */
    @font-face {
      font-family: 'WenQuanYi Micro Hei';
      src: url('fonts/wqy-microhei.ttf') format('truetype');
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; background:#0f1115; color:#e6e6e6; height:100vh; overflow:hidden; }
    button { cursor:pointer; border:none; border-radius:8px; padding:8px 14px; background:#3b82f6; color:#fff; font-size:14px; }
    button:hover { background:#2563eb; }
    input { border-radius:8px; border:1px solid #2a2f3a; background:#161a22; color:#e6e6e6; padding:9px 12px; font-size:14px; outline:none; }
    input:focus { border-color:#3b82f6; }
    .center { height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
    .card { background:#161a22; padding:28px 32px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.4); width:380px; }
    .card h1 { font-size:20px; margin:0 0 4px; }
    .card p { color:#9aa3b2; font-size:13px; margin:0 0 18px; }
    .row { display:flex; gap:8px; margin-bottom:12px; flex-direction:column; }
    .row-inline { flex-direction:row; }
    .muted { color:#9aa3b2; font-size:12px; }
    #app { display:flex; height:100vh; }
    .sidebar { width:240px; background:#12151c; border-right:1px solid #232838; display:flex; flex-direction:column; }
    .sidebar .head { padding:14px; border-bottom:1px solid #232838; }
    .sidebar .head .me { font-weight:600; }
    .peer { padding:10px 14px; border-bottom:1px solid #1c2230; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
    .peer:hover { background:#1a1f2b; }
    .peer.active { background:#1e2740; }
    .dot { width:8px; height:8px; border-radius:50%; background:#555; display:inline-block; margin-right:6px; }
    .dot.on { background:#22c55e; }
    .main { flex:1; display:flex; flex-direction:column; }
    .msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .bubble { max-width:70%; padding:9px 13px; border-radius:12px; font-size:14px; line-height:1.4; word-break:break-word; }
    .mine { align-self:flex-end; background:#2563eb; }
    .theirs { align-self:flex-start; background:#232a38; }
    .bubble .meta { font-size:11px; opacity:.6; margin-top:3px; }
    .filecard { background:#1a2030; border:1px solid #2a3550; border-radius:10px; padding:10px 12px; max-width:70%; align-self:flex-start; font-size:13px; }
    .filecard .bar { height:6px; background:#2a3550; border-radius:4px; margin-top:8px; overflow:hidden; }
    .filecard .bar > div { height:100%; background:#3b82f6; width:0; transition:width .15s; }
    .filecard .acts { margin-top:8px; display:flex; gap:8px; }
    .composer { border-top:1px solid #232838; padding:12px; display:flex; gap:8px; align-items:center; }
    .composer input[type=text] { flex:1; }
    .hint { padding:12px 14px; color:#9aa3b2; font-size:12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="renderer.js"></script>
</body>
</html>
